<!DOCTYPE html>
<!--
  بلا dir="rtl" على الصفحة: التطبيق يرسم اتجاهه بنفسه، واتجاه الصفحة من اليمين
  يزيح عناصر HTML المضمّنة (صور الأغلفة والفيديو) عن مواضعها.
-->
<html lang="ar">
<head>
  <!--
    مسار النشر: يُستبدل بقيمة --base-href عند البناء (الافتراضي /).
    يبدأ وينتهي بـ «/».
  -->
  <base href="/moddaker-i18n-preview/">

  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="برنامج مدكر: دورات قصيرة في تفسير القرآن الكريم، إحدى مبادرات جمعية البرهان.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131014" media="(prefers-color-scheme: dark)">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <!-- نسخة متصفح فقط: لا تثبيت ولا عامل خدمة (انظر README.md) -->
  <link rel="manifest" href="manifest.json">

  <title>برنامج مدكر</title>

  <style>
    /* خلفية التطبيق قبل تحميله، بلا وميض أبيض في المظهر الداكن */
    html, body {
      height: 100%;
      margin: 0;
      background-color: #FFFFFF;
    }

    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #131014;
      }
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
